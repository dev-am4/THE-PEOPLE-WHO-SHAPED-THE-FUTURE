name: Build Windows Offline Kiosk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'scripts/cache-offline-portraits.mjs'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - '.github/workflows/build-windows-kiosk.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build portable Windows EXE
        run: npm run dist:win

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: THE-PEOPLE-WHO-SHAPED-THE-FUTURE-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
